spring.application.name=artistes-backend
server.port=8080

# ===== Connexion MySQL (XAMPP) =====
# La base artistes_db est créée automatiquement si elle n'existe pas (createDatabaseIfNotExist=true)
spring.datasource.url=jdbc:mysql://localhost:3306/artistes_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# ===== JPA : les tables sont créées / mises à jour automatiquement =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
